[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "welfareguard"
version = "1.0.0rc1"
description = "Eval-to-guardrail pipeline for nonhuman welfare in agentic AI systems (scaffold)"
readme = "src/welfareguard/README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = [
    "ai-safety",
    "guardrails",
    "digital-minds",
    "nonhuman-welfare",
    "agent-security",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Pinned to a commit per ADR-001's dependency-pinning addendum
# (docs/adr/ADR-001-compiler-targets.md, Consequences): unpinned on main through
# Week 4 so the shape tests break loudly on interface drift; pinned to a SHA
# from the Week 5 baseline sweep through the Week 7 experiment freeze, so an
# upstream push mid-sweep cannot make a harm-rate change ambiguous between our
# guard and upstream drift. The pinned commit is aisafepy main as of 2026-08-20.
#
# Note: this is still a PEP 508 direct reference. It installs fine from source
# or VCS, but PyPI rejects direct references in uploaded metadata, so this line
# must become a plain version constraint before the Week 8 release candidate.
# That conversion is blocked upstream: PyPI's aisafepy 0.1.0 (May 2026) and
# this commit carry the same version number, so "aisafepy==0.1.0" would resolve
# to the older wheel. It needs aisafepy to tag a release at or after this SHA.
dependencies = [
    "aisafepy @ git+https://github.com/Vidura-Wijekoon/aisafepy@c1888bfee0141e483d48cf382bf4549a6368d175",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
# Needed only by the Tier-2 classifier compile path. Without these,
# _ClassifierTarget returns a "classifier-deferred-*" artifact carrying its
# training_spec, which is a supported outcome rather than an error -- so the
# regex tier and the whole test suite run without them.
# On a CPU-only machine install torch from https://download.pytorch.org/whl/cpu;
# the default PyPI wheel pulls 16+ NVIDIA CUDA packages that go unused.
classifier = [
    "torch>=2.2",
    "transformers>=4.40",
]

[project.urls]
Repository = "https://github.com/welfareguard/welfareguard"
Issues = "https://github.com/welfareguard/welfareguard/issues"

# Required by hatchling to accept the PEP 508 direct reference in
# `project.dependencies` above. Drop this together with that reference once
# aisafepy is resolvable by plain version constraint.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/welfareguard"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/specs",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by the formatter
    "RUF022", # __all__ ordering is deliberate (grouped runtime / compile-time /
              # kinds / errors), matching aisafepy's own rationale for this ignore
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
